<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chamados & Novidades</title>
<style>
:root{--bg:#0d1117;--surface:#161b22;--surface2:#1c2230;--border:#21262d;--text:#e6edf3;--text2:#adbac7;--muted:#8b949e;--blue:#3b82f6;--green:#10b981;--amber:#f59e0b;--red:#ef4444;--orange:#f97316;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;}
button{font-family:inherit;cursor:pointer;}
#login-screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0a0d14,#0f1117,#111827);z-index:100;padding:16px;}
.login-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:36px;width:100%;max-width:360px;}
.login-card h1{font-size:20px;margin-bottom:4px;text-align:center;}
.login-card .sub{font-size:12px;color:var(--muted);text-align:center;margin-bottom:22px;}
.login-card label{display:block;font-size:12px;color:var(--text2);margin:12px 0 5px;}
.login-card input{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:10px 12px;font-size:13px;outline:none;}
.login-card button{width:100%;background:var(--orange);color:#fff;border:none;border-radius:8px;padding:11px;font-size:14px;font-weight:600;margin-top:18px;}
#login-error{color:var(--red);font-size:12px;text-align:center;margin-top:10px;min-height:16px;}
#app{display:none;min-height:100vh;}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20;flex-wrap:wrap;gap:10px;}
.topbar h1{font-size:17px;}
.btn{background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:8px 14px;font-size:13px;transition:.15s;}
.btn:hover{border-color:var(--orange);}
.btn.primary{background:var(--orange);border-color:var(--orange);color:#fff;}
.btn.green{background:var(--green);border-color:var(--green);color:#fff;}
.btn.sm{padding:4px 9px;font-size:12px;}
.btn.ghost{background:transparent;}
.wrap{max-width:1300px;margin:0 auto;padding:22px;}
.tabs-nav{display:flex;gap:8px;margin-bottom:20px;}
.tabbtn{background:var(--surface);border:1px solid var(--border);color:var(--text2);border-radius:10px;padding:9px 18px;font-size:13px;font-weight:600;}
.tabbtn.active{background:var(--orange);border-color:var(--orange);color:#fff;}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px;}
@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr);}}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;}
.stat .v{font-size:24px;font-weight:700;line-height:1;}
.stat .l{font-size:11px;color:var(--muted);margin-top:6px;}
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap;}
.toolbar input,.toolbar select{background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:8px 12px;font-size:13px;outline:none;}
.toolbar .search{flex:1;min-width:170px;}
.tbl-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;}
.tbl-scroll{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{background:var(--surface2);text-align:left;padding:11px 12px;font-size:11px;text-transform:uppercase;color:var(--muted);white-space:nowrap;border-bottom:1px solid var(--border);}
td{padding:11px 12px;border-bottom:1px solid var(--border);vertical-align:top;color:var(--text2);}
tr:hover td{background:#ffffff05;}
td.ml{white-space:pre-line;max-width:260px;font-size:12px;}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap;}
.b-open{background:#3b82f622;color:#60a5fa;}
.b-run{background:#f59e0b22;color:#fbbf24;}
.b-done{background:#10b98122;color:#34d399;}
.b-late{background:#ef444422;color:#f87171;}
.tag{display:inline-block;background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:2px 8px;font-size:11px;margin:1px 2px 1px 0;}
.empty{text-align:center;padding:36px;color:var(--muted);}
.overlay{position:fixed;inset:0;background:#000000aa;display:none;align-items:center;justify-content:center;z-index:50;padding:16px;}
.overlay.show{display:flex;}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:14px;width:100%;max-width:600px;max-height:92vh;overflow:auto;}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border);}
.modal-head h3{font-size:16px;}
.modal-head .x{background:none;border:none;color:var(--muted);font-size:22px;}
.modal-body{padding:20px;}
.fld{margin-bottom:13px;}
.fld label{display:block;font-size:12px;color:var(--text2);margin-bottom:5px;}
.fld input,.fld textarea,.fld select{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:9px 12px;font-size:13px;outline:none;font-family:inherit;}
.fld textarea{min-height:64px;resize:vertical;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.modal-foot{display:flex;gap:10px;justify-content:flex-end;padding:16px 20px;border-top:1px solid var(--border);}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:11px 20px;border-radius:10px;font-size:13px;z-index:200;opacity:0;transition:.3s;pointer-events:none;}
.toast.show{opacity:1;bottom:30px;}
.nitem{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--border);}
.nitem:last-child{border-bottom:none;}
.nitem .nd{min-width:86px;color:var(--muted);font-size:12px;font-weight:600;}
.nitem .nb .ns{font-size:12px;color:var(--orange);font-weight:600;margin-bottom:3px;}
.nitem .nb .nt{font-size:13px;color:var(--text2);line-height:1.5;}
</style>
</head>
<body>
<div id="login-screen">
  <div class="login-card">
    <h1>🛠 Chamados</h1>
    <div class="sub">Área do administrador</div>
    <label>Usuário</label><input id="login-user" onkeydown="if(event.key==='Enter')doLogin()">
    <label>Senha</label><input type="password" id="login-pass" onkeydown="if(event.key==='Enter')doLogin()">
    <button onclick="doLogin()">Entrar</button>
    <div id="login-error"></div>
  </div>
</div>

<div id="app">
  <div class="topbar">
    <h1>🛠 Chamados <span style="color:var(--muted);font-weight:400;font-size:13px">&amp; Novidades</span></h1>
    <div style="display:flex;gap:10px">
      <button class="btn primary" id="btnNovo" onclick="openModal()">+ Abrir Chamado</button>
      <button class="btn ghost" onclick="exportCSV()">⬇ CSV</button>
    </div>
  </div>
  <div class="wrap">
    <div class="tabs-nav">
      <button class="tabbtn active" id="tb-ch" onclick="switchTab('ch',this)">🛠 Chamados</button>
      <button class="tabbtn" id="tb-nv" onclick="switchTab('nv',this)">🔔 Novidades</button>
    </div>

    <div id="tab-ch">
      <div class="stats" id="statsBox"></div>
      <div class="toolbar">
        <input class="search" id="q" placeholder="🔎 Buscar chamado, pessoa..." oninput="render()">
        <select id="fStatus" onchange="render()">
          <option value="ativos">Em aberto (Aberto + Em andamento)</option>
          <option value="">Todos</option>
          <option value="Aberto">Aberto</option>
          <option value="Em andamento">Em andamento</option>
          <option value="Concluído">Concluído</option>
        </select>
        <select id="fSis" onchange="render()"><option value="">Todos os sistemas</option></select>
      </div>
      <div class="tbl-card"><div class="tbl-scroll">
        <table>
          <thead><tr><th>#</th><th>Título</th><th>Sistema</th><th>Tipo</th><th>Descrição / Melhoria</th><th>Aberto por</th><th>Envolvidos</th><th>Prazo</th><th>Status</th><th>Ações</th></tr></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div></div>
    </div>

    <div id="tab-nv" style="display:none">
      <div class="tbl-card" style="padding:6px 20px">
        <div style="display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--border)">
          <div style="font-size:13px;color:var(--text2)">Histórico de atualizações e melhorias de cada sistema.</div>
          <button class="btn sm" onclick="novaNovidade()">+ Nova atualização</button>
        </div>
        <div id="nvList"></div>
      </div>
    </div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-head"><h3 id="mTitle">Abrir Chamado</h3><button class="x" onclick="closeModal()">&times;</button></div>
    <div class="modal-body">
      <div class="fld"><label>Título *</label><input id="mTit" placeholder="Resumo curto do chamado"></div>
      <div class="grid2">
        <div class="fld"><label>Sistema (ícone) *</label><select id="mSis"></select></div>
        <div class="fld"><label>Tipo</label><select id="mTipo"><option>Melhoria</option><option>Alteração</option><option>Erro / Correção</option><option>Novo recurso</option></select></div>
      </div>
      <div class="fld"><label>Descrição — qual alteração/melhoria *</label><textarea id="mDesc" placeholder="Descreva o que precisa ser feito"></textarea></div>
      <div class="grid2">
        <div class="fld"><label>Aberto por *</label><input id="mAb" placeholder="Quem está abrindo"></div>
        <div class="fld"><label>Envolvidos</label><input id="mEnv" placeholder="Nomes separados por vírgula"></div>
      </div>
      <div class="grid2">
        <div class="fld"><label>Prazo</label><input type="date" id="mPrazo"></div>
        <div class="fld"><label>Status</label><select id="mSt"><option>Aberto</option><option>Em andamento</option><option>Concluído</option></select></div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn primary" onclick="saveItem()">Salvar</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

var SISTEMAS=['🌐 Portal','⛽ Abastecimento','🧭 Direção Inteligente','🚌 Biarticulado','🎓 LNT','📅 Agenda das Salas','🎯 Plano de Ação','🔐 Segurança','Outro'];

or."}, {"data": "2026-06-30", "sistema": "🎓 LNT", "texto": "LNT embutido no portal com aba 📎 Anexos: anexar, visualizar, baixar e remover PDFs vinculados a cada registro, gravados no banco."}, {"data": "2026-06-30", "sistema": "🚌 Biarticulado", "texto": "Versão v3 instalada; datas do Excel corrigidas (fim do Invalid Date/NaN); colunas da tabela alinhadas."}, {"data": "2026-07-02", "sistema": "🛠 Chamados", "texto": "Novo sistema (só admin): abertura de chamados completos — quem abriu, envolvidos, sistema, tipo, prazo com alerta de vencido, status e CSV — mais a aba 🔔 Novidades com o histórico de atualizações."}, {"data": "2026-07-02", "sistema": "🔑 Login", "texto": "Login simplificado: agora basta digitar o usuário e o código do Google Authenticator. A senha só é pedida uma única vez, no primeiro acesso, para cadastrar o autenticador com segurança."}, {"data": "2026-07-03", "sistema": "📅 Agenda das Salas", "texto": "Quem criou a reserva agora pode editar (✎) e cancelar (×); os demais só visualizam. Visual mais amplo, edição completa com verificação de conflito e responsável preenchido automaticamente."}, {"data": "2026-07-03", "sistema": "🏠 Tela inicial", "texto": "Cards das salas com a cor de cada uma (🟠 Laranja / 🟢 Verde) listando as agendas de hoje: horário, evento e responsável — sincronizado para todos."}, {"data": "2026-07-03", "sistema": "📱 WhatsApp (n8n)", "texto": "Integração com o n8n: URL do webhook configurável em Configurações, teste com diagnóstico detalhado e convite automático disparado a cada reserva de sala."}, {"data": "2026-07-03", "sistema": "🔗 Convites", "texto": "Convite por link: o admin gera um link (validade 7 dias, uso único) e a pessoa cria sozinha o login, a senha e o autenticador — sem trabalho para o admin."}, {"data": "2026-07-03", "sistema": "📆 Minha Agenda", "texto": "Novo sistema: agenda individual por login, sincronizada no banco. Reservas de sala entram automaticamente na agenda de quem criou (e acompanham edição/cancelamento)."}, var chamados=[], novidades=[], editId=null;

function load(){
  try{ var c=localStorage.getItem(CH_KEY); chamados=c?JSON.parse(c):[]; }catch(e){ chamados=[]; }
  try{ var n=localStorage.getItem(NV_KEY); novidades=n?JSON.parse(n):null; }catch(e){ novidades=null; }
  if(!novidades || !Array.isArray(novidades)) novidades=[];
  /* mescla: adiciona novidades do seed que ainda nao existem */
  var _have={}; novidades.forEach(function(x){ _have[(x.data||'')+'|'+(x.texto||'')]=1; });
  var _add=false;
  NV_SEED.forEach(function(x){ if(!_have[(x.data||'')+'|'+(x.texto||'')]){ novidades.push(x); _add=true; } });
  if(_add) saveNv();
}
function saveCh(){ try{ localStorage.setItem(CH_KEY, JSON.stringify(chamados)); }catch(e){} }
function saveNv(){ try{ localStorage.setItem(NV_KEY, JSON.stringify(novidades)); }catch(e){} }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fdate(d){ if(!d)return '—'; var x=new Date(d+'T00:00:00'); return isNaN(x)?'—':x.toLocaleDateString('pt-BR'); }
function hoje(){ var d=new Date(); return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
function vencido(c){ return c.prazo && c.status!=='Concluído' && c.prazo<hoje(); }

function switchTab(t,btn){
  document.getElementById('tab-ch').style.display=(t==='ch')?'block':'none';
  document.getElementById('tab-nv').style.display=(t==='nv')?'block':'none';
  document.getElementById('btnNovo').style.display=(t==='ch')?'':'none';
  document.querySelectorAll('.tabbtn').forEach(function(b){b.classList.remove('active');});
  if(btn)btn.classList.add('active');
  if(t==='nv')renderNv();
}
function stats(){
  var ab=chamados.filter(function(c){return c.status==='Aberto';}).length;
  var an=chamados.filter(function(c){return c.status==='Em andamento';}).length;
  var vc=chamados.filter(vencido).length;
  var cc=chamados.filter(function(c){return c.status==='Concluído';}).length;
  var s=[{v:ab,l:'Abertos',c:'#60a5fa'},{v:an,l:'Em andamento',c:'#fbbf24'},{v:vc,l:'Prazo vencido',c:'#f87171'},{v:cc,l:'Concluídos',c:'#34d399'}];
  document.getElementById('statsBox').innerHTML=s.map(function(x){return '<div class="stat"><div class="v" style="color:'+x.c+'">'+x.v+'</div><div class="l">'+x.l+'</div></div>';}).join('');
}
function fillSisSelects(){
  var opts=SISTEMAS.map(function(s){return '<option>'+s+'</option>';}).join('');
  document.getElementById('mSis').innerHTML=opts;
  var f=document.getElementById('fSis');
  if(f.options.length<=1) f.innerHTML='<option value="">Todos os sistemas</option>'+opts;
}
function badge(c){
  if(vencido(c)) return '<span class="badge b-late">⏰ Vencido</span>';
  if(c.status==='Concluído') return '<span class="badge b-done">✔ Concluído</span>';
  if(c.status==='Em andamento') return '<span class="badge b-run">◐ Em andamento</span>';
  return '<span class="badge b-open">● Aberto</span>';
}
function render(){
  stats(); fillSisSelects();
  var q=(document.getElementById('q').value||'').toLowerCase();
  var fs=document.getElementById('fStatus').value;
  var fsis=document.getElementById('fSis').value;
  var rows=chamados.slice().sort(function(a,b){
    var va=vencido(a)?0:1, vb=vencido(b)?0:1;
    if(va!==vb)return va-vb;
    var oa=a.status==='Concluído'?1:0, ob=b.status==='Concluído'?1:0;
    if(oa!==ob)return oa-ob;
    return (a.prazo||'9999')<(b.prazo||'9999')?-1:1;
  });
  var html=rows.filter(function(c){
    if(fs==='ativos' && c.status==='Concluído')return false;
    if(fs && fs!=='ativos' && c.status!==fs)return false;
    if(fsis && c.sistema!==fsis)return false;
    if(!q)return true;
    return (c.titulo+' '+c.desc+' '+c.abertoPor+' '+c.envolvidos+' '+c.sistema).toLowerCase().indexOf(q)>=0;
  }).map(function(c){
    var env=(c.envolvidos||'').split(',').map(function(e){e=e.trim();return e?'<span class="tag">'+esc(e)+'</span>':'';}).join('');
    return '<tr>'+
      '<td style="font-weight:700;color:var(--orange)">'+c.id+'</td>'+
      '<td style="color:var(--text);font-weight:500;min-width:140px">'+esc(c.titulo)+'</td>'+
      '<td style="white-space:nowrap">'+esc(c.sistema)+'</td>'+
      '<td><span class="tag">'+esc(c.tipo)+'</span></td>'+
      '<td class="ml">'+esc(c.desc)+'</td>'+
      '<td>'+esc(c.abertoPor)+'</td>'+
      '<td style="min-width:120px">'+(env||'—')+'</td>'+
      '<td style="white-space:nowrap;'+(vencido(c)?'color:#f87171;font-weight:600':'')+'">'+fdate(c.prazo)+'</td>'+
      '<td>'+badge(c)+'</td>'+
      '<td style="white-space:nowrap">'+
        (c.status!=='Concluído'?'<button class="btn sm green" onclick="concluir('+c.id+')">✔</button> ':'')+
        '<button class="btn sm ghost" onclick="openModal('+c.id+')">✎</button> '+
        '<button class="btn sm ghost" style="color:var(--red)" onclick="delItem('+c.id+')">✕</button></td>'+
    '</tr>';
  }).join('');
  document.getElementById('tbody').innerHTML=html||'<tr><td colspan="10"><div class="empty">Nenhum chamado. Clique em "+ Abrir Chamado".</div></td></tr>';
}
function openModal(id){
  editId=id||null;
  var c=id?chamados.find(function(x){return x.id===id;}):null;
  fillSisSelects();
  document.getElementById('mTitle').textContent=id?('Editar Chamado #'+id):'Abrir Chamado';
  document.getElementById('mTit').value=c?c.titulo:'';
  document.getElementById('mSis').value=c?c.sistema:SISTEMAS[0];
  document.getElementById('mTipo').value=c?c.tipo:'Melhoria';
  document.getElementById('mDesc').value=c?c.desc:'';
  document.getElementById('mAb').value=c?c.abertoPor:(window.__usuarioPortal||'');
  document.getElementById('mEnv').value=c?c.envolvidos:'';
  document.getElementById('mPrazo').value=c?(c.prazo||''):'';
  document.getElementById('mSt').value=c?c.status:'Aberto';
  document.getElementById('overlay').classList.add('show');
}
function closeModal(){ document.getElementById('overlay').classList.remove('show'); }
function saveItem(){
  var t=document.getElementById('mTit').value.trim();
  var d=document.getElementById('mDesc').value.trim();
  var ab=document.getElementById('mAb').value.trim();
  if(!t||!d||!ab){ toast('⚠ Preencha título, descrição e quem abriu.'); return; }
  var obj={titulo:t,sistema:document.getElementById('mSis').value,tipo:document.getElementById('mTipo').value,
    desc:d,abertoPor:ab,envolvidos:document.getElementById('mEnv').value.trim(),
    prazo:document.getElementById('mPrazo').value||'',status:document.getElementById('mSt').value,
    atualizadoEm:hoje()};
  if(editId){ var c=chamados.find(function(x){return x.id===editId;}); Object.assign(c,obj); }
  else { obj.id=chamados.reduce(function(m,x){return Math.max(m,x.id||0);},0)+1; obj.criadoEm=hoje(); chamados.push(obj); }
  saveCh(); render(); closeModal(); toast('✅ Chamado salvo!');
}
function concluir(id){ var c=chamados.find(function(x){return x.id===id;}); if(!c)return; if(!confirm('Concluir o chamado #'+id+' — '+c.titulo+'?'))return; c.status='Concluído'; c.atualizadoEm=hoje(); saveCh(); render(); toast('✔ Chamado concluído!'); }
function delItem(id){ if(!confirm('Excluir o chamado #'+id+'?'))return; chamados=chamados.filter(function(x){return x.id!==id;}); saveCh(); render(); toast('🗑 Excluído.'); }
function exportCSV(){
  var head=['#','Título','Sistema','Tipo','Descrição','Aberto por','Envolvidos','Prazo','Status','Criado em'];
  var rows=chamados.map(function(c){return [c.id,c.titulo,c.sistema,c.tipo,c.desc,c.abertoPor,c.envolvidos,c.prazo,c.status,c.criadoEm]
    .map(function(x){return '"'+String(x==null?'':x).replace(/"/g,'""').replace(/\n/g,' ')+'"';}).join(';');});
  var blob=new Blob(['\uFEFF'+head.join(';')+'\n'+rows.join('\n')],{type:'text/csv;charset=utf-8'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='chamados.csv';a.click();
  toast('⬇ CSV exportado.');
}
function renderNv(){
  var el=document.getElementById('nvList');
  var arr=novidades.slice().sort(function(a,b){return (b.data||'')<(a.data||'')?-1:1;});
  el.innerHTML=arr.map(function(n){
    return '<div class="nitem"><div class="nd">'+fdate(n.data)+'</div><div class="nb"><div class="ns">'+esc(n.sistema)+'</div><div class="nt">'+esc(n.texto)+'</div></div></div>';
  }).join('')||'<div class="empty">Nenhuma novidade.</div>';
}
function novaNovidade(){
  var sis=prompt('Sistema (ex.: 🌐 Portal, 🎓 LNT):',SISTEMAS[0]); if(sis===null)return;
  var txt=prompt('Descreva a atualização/melhoria:'); if(txt===null||!txt.trim())return;
  novidades.push({data:hoje(),sistema:sis.trim()||'🌐 Portal',texto:txt.trim()});
  saveNv(); renderNv(); toast('🔔 Novidade publicada!');
}
var toastT;
function toast(m){ var t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(function(){t.classList.remove('show');},2600); }
function doLogin(){
  var u=(document.getElementById('login-user').value||'').trim().toLowerCase();
  var p=(document.getElementById('login-pass').value||'').trim();
  if(u==='lorena'&&p==='8586'){ entrar(); } else { document.getElementById('login-error').textContent='Usuário ou senha inválidos.'; }
}
function entrar(){
  document.getElementById('login-screen').style.display='none';
  document.getElementById('app').style.display='block';
  load(); render();
}
(function(){
  var emb; try{ emb=(window.self!==window.top); }catch(e){ emb=true; }
  if(!emb) return;
  try{ if(window.parent&&window.parent.currentSession) window.__usuarioPortal=window.parent.currentSession.name||''; }catch(e){}
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',entrar); else entrar();
})();
</script>
<script>
/* ☁ Receptor do painel Drive do Redentor Hub */
window.addEventListener("message",function(ev){
  try{
    var d=ev.data;
    if(!(d&&d.hubDrive==="import"&&d.buf))return;
    var f=new File([d.buf],d.nome||"planilha.xlsx",{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
    var inp=document.querySelector("input[type=file][accept*=xls i]")||document.querySelector("input[type=file][accept*=sheet i]")||document.querySelector("input[type=file]");
    if(inp){
      try{
        var dt=new DataTransfer(); dt.items.add(f); inp.files=dt.files;
        try{ev.source.postMessage({hubDrive:"ok"},"*");}catch(e){}
        inp.dispatchEvent(new Event("change",{bubbles:true}));
        return;
      }catch(e){}
    }
    /* sem importador nativo: o Hub mostra o aviso adequado */
  }catch(e){}
});
</script>
