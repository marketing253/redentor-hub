/* ─── LISTA ──────────────────────────────────────── */
function Lista({agends,onRemover,onEditar}){
  const convMap=useMemo(()=>mapaConvitesSalas(),[agends]);
  const agrup=useMemo(()=>{
    const m={};
    [...agends].sort((a,b)=>a.data.localeCompare(b.data)||a.inicio.localeCompare(b.inicio))
      .forEach(a=>{if(!m[a.data])m[a.data]=[];m[a.data].push(a);});
    return m;
  },[agends]);

  if(!agends.length) return(
    <div className="card"><div className="empty">
      <div className="ico">📅</div><p>Nenhum agendamento.</p>
      <p style={{marginTop:4}}>Use o formulário para criar reservas.</p>
    </div></div>
  );

  return(
    <div className="card card-p">
      <div className="card-title" style={{marginBottom:14}}>Todos os Agendamentos</div>
      <div className="lista-sc">
        {Object.entries(agrup).map(([dt,items])=>(
          <div key={dt}>
            <div className="dia-sep">{diaSem(dt)} — {fmtD(dt)}<div className="dia-line"/></div>
            {items.map(a=>{
              const sl=SALAS.find(s=>s.id===a.salaId);
              return(
                <div key={a.id} className="li-item"
                  style={{background:sl.id==='angelo'?'#fff7ed':'#f0fdf4'}}>
                  <div className="li-bar" style={{background:sl.hex}}/>
                  <div className="li-body">
                    <div className="li-ev">{a.evento}</div>
                    <div className="li-sala" style={{color:sl.hex}}>{sl.nome}</div>
                    <div className="li-nm">👤 {a.responsavel}</div>
                    {convMap[a.id]&&<div className="li-nm" title="Participantes convidados (✔ = aceitaram)">👥 {convMap[a.id].n} convidado(s){convMap[a.id].ac?` · ${convMap[a.id].ac} ✔`:''}</div>}
                  </div>
                  <div style={{textAlign:'right',flexShrink:0}}>
                    <div className="li-time">{a.inicio}–{a.fim}</div>
                    <div style={{fontSize:'.6rem',color:'var(--t4)',marginTop:2}}>{fmtD(a.data)}</div>
                  </div>
                  {podeMexer(a)&&<button className="btn-ed" title="Editar horário" onClick={()=>onEditar(a)}>✎</button>}
                  {podeMexer(a)&&<button className="btn-rm" title="Cancelar agendamento" onClick={()=>onRemover(a)}>×</button>}
                </div>
              );
            })}
          </div>
        ))}
      </div>
    </div>
  );
}

/* ─── DASHBOARD ──────────────────────────────────── */
function Dashboard({agends}){
  const [dIni,setDIni]=useState('');
  const [dFim,setDFim]=useState('');
  const [sala,setSala]=useState('');

  const filtered=useMemo(()=>agends.filter(a=>{
    if(sala&&a.salaId!==sala) return false;
    if(dIni&&a.data<dIni) return false;
    if(dFim&&a.data>dFim) return false;
    return true;
  }),[agends,sala,dIni,dFim]);

  /* KPIs */
  const total=filtered.length;
  const totalHoje=agends.filter(a=>a.data===hoje()).length;
  const salas=SALAS.map(s=>({...s,qt:filtered.filter(a=>a.salaId===s.id).length}));
  const hTotalMins=filtered.reduce((s,a)=>s+t2m(a.fim)-t2m(a.inicio),0);
  const hTotal=durLabel(hTotalMins)||'0h';

  /* Eventos top (por nome) */
  const evMap={};
  filtered.forEach(a=>{ const k=a.evento; evMap[k]=(evMap[k]||0)+1; });
  const evTop=Object.entries(evMap).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const evMax=evTop[0]?.[1]||1;

  /* Por sala donut */
  const donutData=salas.filter(s=>s.qt>0);
  const DONUT_R=54, DONUT_CX=70, DONUT_CY=70, CIRC=2*Math.PI*DONUT_R;
  let offset=0;
  const donutSlices=donutData.map(s=>{
    const pct=s.qt/total;
    const dash=pct*CIRC;
    const sl={s,pct,dash,offset};
    offset+=dash;
    return sl;
  });

  /* Evolução por data */
  const datesUniq=[...new Set(filtered.map(a=>a.data))].sort();
  const sparkData=datesUniq.map(d=>({d,qt:filtered.filter(a=>a.data===d).length}));
  const sparkMax=Math.max(...sparkData.map(s=>s.qt),1);

  /* Por responsável top */
  const respMap={};
  filtered.forEach(a=>{ respMap[a.responsavel]=(respMap[a.responsavel]||0)+1; });
  const respTop=Object.entries(respMap).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const respMax=respTop[0]?.[1]||1;

  /* Ocupação % por sala (expediente 07h–20h = 13h/dia no período filtrado) */
  const perIni=dIni||datesUniq[0]||hoje(), perFim=dFim||datesUniq[datesUniq.length-1]||hoje();
  const nDias=Math.max(1,Math.round((new Date(perFim+'T12:00')-new Date(perIni+'T12:00'))/86400000)+1);
  const capMin=nDias*13*60;
  const ocup=SALAS.map(sx=>{
    const min=filtered.filter(a=>a.salaId===sx.id).reduce((t,a)=>t+Math.max(0,t2m(a.fim)-t2m(a.inicio)),0);
    return {...sx,min,pct:capMin?Math.min(100,Math.round(min/capMin*100)):0};
  });
  /* Horários de pico (reservas que ocupam cada hora) */
  const horasPico=Array.from({length:13},(_,i)=>{const h=7+i;return{h,qt:filtered.filter(a=>t2m(a.inicio)<(h+1)*60&&t2m(a.fim)>h*60).length};});
  const picoMax=Math.max(...horasPico.map(x=>x.qt),1);
  /* Confirmações de presença (convites do painel 📩) */
  const convStats=useMemo(()=>{
    const ids=new Set(filtered.map(a=>String(a.id)));
    let tot=0,ac=0,rc=0,pen=0;
    try{
      if(window.parent&&window.parent!==window&&typeof window.parent._agcLoad==='function'){
        window.parent._agcLoad().forEach(c=>{
          if(!c||String(c.refEvento||'').indexOf('sala-')!==0)return;
          if(!ids.has(String(c.refEvento).slice(5)))return;
          if(c.status==='cancelado')return;
          tot++; if(c.status==='aceito')ac++; else if(c.status==='recusado')rc++; else pen++;
        });
      }
    }catch(e){}
    return {tot,ac,rc,pen};
  },[filtered]);

  return(
    <div>
      {/* Filtros */}
      <div className="filter-bar">
        <div className="fld">
          <label>Data Início</label>
          <input className="finp" type="date" value={dIni} onChange={e=>setDIni(e.target.value)} style={{minWidth:145}}/>
        </div>
        <div className="fld">
          <label>Data Fim</label>
          <input className="finp" type="date" value={dFim} onChange={e=>setDFim(e.target.value)} style={{minWidth:145}}/>
        </div>
        <div className="fld">
          <label>Sala</label>
          <select className="fsel" value={sala} onChange={e=>setSala(e.target.value)} style={{minWidth:160}}>
            <option value="">Todas as Salas</option>
            {SALAS.map(s=><option key={s.id} value={s.id}>{s.nome}</option>)}
          </select>
        </div>
        {(dIni||dFim||sala)&&(
          <button className="btn-ghost" onClick={()=>{setDIni('');setDFim('');setSala('');}}>
            ✕ Limpar
          </button>
        )}
      </div>

      {/* KPI CARDS */}
      <div className="stat-grid">
        <div className="card stat-card">
          <div className="stat-ico" style={{background:'var(--ahl)'}}>📋</div>
          <div className="stat-n">{total}</div>
          <div className="stat-l">Total de Eventos</div>
          <div className={`stat-delta ${totalHoje>0?'up':'dn'}`}>{totalHoje} hoje</div>
        </div>
        {salas.map(s=>(
          <div key={s.id} className="card stat-card">
            <div className="stat-ico" style={{background:`${s.hex}18`}}>
              <span style={{fontWeight:900,color:s.hex,fontSize:'.85rem'}}>{s.nome[0]}</span>
            </div>
            <div className="stat-n" style={{color:s.hex}}>{s.qt}</div>
            <div className="stat-l">{s.nome.replace('Sala ','')}</div>
            <div className="stat-delta up">{total?Math.round(s.qt/total*100):0}% do total</div>
          </div>
        ))}
        <div className="card stat-card">
          <div className="stat-ico" style={{background:'#fef3c7'}}>⏱️</div>
          <div className="stat-n" style={{fontSize:'1.25rem'}}>{hTotal}</div>
          <div className="stat-l">Horas de Uso</div>
          <div className="stat-delta up">reservadas</div>
        </div>
      </div>

      {/* Ocupação · Picos · Confirmações */}
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(280px,1fr))',gap:16,marginBottom:16}}>
        <div className="card card-p">
          <div className="card-title" style={{marginBottom:4}}>Ocupação das Salas</div>
          <div className="card-sub" style={{marginBottom:14}}>{nDias} dia(s) no período · expediente 07h–20h</div>
          {ocup.map(sx=>(
            <div key={sx.id} style={{marginBottom:13}}>
              <div style={{display:'flex',justifyContent:'space-between',fontSize:'.72rem',fontWeight:700,color:'var(--t2)',marginBottom:5}}>
                <span>{sx.nome}</span><span style={{color:sx.hex}}>{sx.pct}%</span>
              </div>
              <div style={{height:8,background:'var(--sur3)',borderRadius:99,overflow:'hidden'}}>
                <div style={{width:sx.pct+'%',height:'100%',background:sx.hex,borderRadius:99,transition:'width .4s'}}/>
              </div>
              <div style={{fontSize:'.62rem',color:'var(--t4)',marginTop:4}}>{durLabel(sx.min)||'0h'} reservadas de {durLabel(capMin)||'—'} disponíveis</div>
            </div>
          ))}
        </div>
        <div className="card card-p">
          <div className="card-title" style={{marginBottom:4}}>Horários de Pico</div>
          <div className="card-sub" style={{marginBottom:14}}>Reservas que ocupam cada hora do dia</div>
          <div style={{display:'flex',alignItems:'flex-end',gap:4,height:96}}>
            {horasPico.map(x=>(
              <div key={x.h} style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:4,minWidth:0}} title={x.h+'h — '+x.qt+' reserva(s)'}>
                <div style={{width:'100%',height:Math.max(3,x.qt/picoMax*70)+'px',background:(x.qt===picoMax&&x.qt>0)?'var(--a)':'var(--brd2)',borderRadius:'4px 4px 0 0',transition:'height .4s, background .4s'}}/>
                <span style={{fontSize:'.55rem',color:'var(--t4)'}}>{x.h}h</span>
              </div>
            ))}
          </div>
        </div>
        <div className="card card-p">
          <div className="card-title" style={{marginBottom:4}}>Confirmações de Presença</div>
          <div className="card-sub" style={{marginBottom:14}}>Convites enviados aos participantes</div>
          {convStats.tot===0
            ? <div className="empty" style={{padding:'16px 0'}}><p>Nenhum convite no período.</p></div>
            : <>
              <div style={{display:'flex',alignItems:'baseline',gap:8}}>
                <span style={{fontSize:'1.9rem',fontWeight:800,color:'#16a34a'}}>{Math.round(convStats.ac/convStats.tot*100)}%</span>
                <span style={{fontSize:'.7rem',color:'var(--t3)'}}>de aceite ({convStats.ac} de {convStats.tot})</span>
              </div>
              <div style={{display:'flex',height:10,borderRadius:99,overflow:'hidden',margin:'10px 0 12px',background:'var(--sur3)'}}>
                {convStats.ac>0&&<div style={{width:(convStats.ac/convStats.tot*100)+'%',background:'#16a34a'}}/>}
                {convStats.pen>0&&<div style={{width:(convStats.pen/convStats.tot*100)+'%',background:'#d97706'}}/>}
                {convStats.rc>0&&<div style={{width:(convStats.rc/convStats.tot*100)+'%',background:'#dc2626'}}/>}
              </div>
              <div style={{display:'flex',gap:14,fontSize:'.66rem',color:'var(--t3)',flexWrap:'wrap'}}>
                <span><b style={{color:'#16a34a'}}>{convStats.ac}</b> aceitos</span>
                <span><b style={{color:'#d97706'}}>{convStats.pen}</b> pendentes</span>
                <span><b style={{color:'#dc2626'}}>{convStats.rc}</b> recusados</span>
              </div>
            </>}
        </div>
      </div>

      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16,marginBottom:16}}>

        {/* Eventos mais frequentes */}
        <div className="card card-p">
          <div className="card-title" style={{marginBottom:4}}>Eventos Mais Frequentes</div>
          <div className="card-sub" style={{marginBottom:16}}>Comparativo por título do evento</div>
          {evTop.length===0
            ? <div className="empty" style={{padding:'24px 0'}}><p>Sem dados no período.</p></div>
            : <div className="bar-chart">
                {evTop.map(([ev,qt])=>(
                  <div key={ev} className="bar-row">
                    <div className="bar-lbl" title={ev}>{ev}</div>
                    <div className="bar-track">
                      <div className="bar-fill" style={{width:`${(qt/evMax)*100}%`,background:'var(--a)',transition:'background .4s'}}>
                        {qt>1&&<span>{qt}×</span>}
                      </div>
                    </div>
                    <div className="bar-val">{qt}</div>
                  </div>
                ))}
              </div>
          }
        </div>

        {/* Distribuição por sala + evolução */}
        <div style={{display:'flex',flexDirection:'column',gap:16}}>

          <div className="card card-p" style={{flex:1}}>
            <div className="card-title" style={{marginBottom:4}}>Distribuição por Sala</div>
            <div className="card-sub" style={{marginBottom:16}}>Proporção de uso por sala</div>
            {total===0
              ? <div className="empty" style={{padding:'16px 0'}}><p>Sem dados.</p></div>
              : <div className="donut-wrap">
                  <svg className="donut-svg" width="140" height="140" viewBox="0 0 140 140">
                    {donutSlices.map(({s,dash,offset})=>(
                      <circle key={s.id} cx={DONUT_CX} cy={DONUT_CY} r={DONUT_R}
                        fill="none" stroke={s.hex} strokeWidth="22"
                        strokeDasharray={`${dash} ${CIRC-dash}`}
                        strokeDashoffset={-offset+CIRC/4}
                        style={{transition:'stroke-dasharray .6s'}}
                      />
                    ))}
                    <text x={DONUT_CX} y={DONUT_CY-6} textAnchor="middle" fontSize="18" fontWeight="900" fill="var(--t1)">{total}</text>
                    <text x={DONUT_CX} y={DONUT_CY+12} textAnchor="middle" fontSize="9" fill="var(--t3)">eventos</text>
                  </svg>
                  <div className="donut-legend">
                    {donutSlices.map(({s,pct})=>(
                      <div key={s.id} className="donut-li">
                        <div className="donut-dot" style={{background:s.hex}}/>
                        <span>{s.nome.replace('Sala ','')}</span>
                        <span className="donut-pct">{Math.round(pct*100)}%</span>
                      </div>
                    ))}
                  </div>
                </div>
            }
          </div>

          <div className="card card-p" style={{flex:1}}>
            <div className="card-title" style={{marginBottom:4}}>Evolução por Data</div>
            <div className="card-sub" style={{marginBottom:12}}>Eventos confirmados por dia</div>
            {sparkData.length===0
              ? <div className="empty" style={{padding:'12px 0'}}><p>Sem dados.</p></div>
              : <div>
                  <div className="sparkline">
                    {sparkData.map(({d,qt})=>(
                      <div key={d} className="spark-bar"
                        style={{height:`${(qt/sparkMax)*100}%`,background:'var(--a)',opacity:.85,transition:'background .4s'}}
                        title={`${fmtD(d)}: ${qt} evento(s)`}/>
                    ))}
                  </div>
                  <div style={{display:'flex',justifyContent:'space-between',marginTop:6}}>
                    <span style={{fontSize:'.6rem',color:'var(--t4)'}}>{fmtD(sparkData[0]?.d)}</span>
                    <span style={{fontSize:'.6rem',color:'var(--t4)'}}>{fmtD(sparkData[sparkData.length-1]?.d)}</span>
                  </div>
                </div>
            }
          </div>
        </div>
      </div>

      {/* Top responsáveis */}
      <div className="card card-p">
        <div className="card-title" style={{marginBottom:4}}>Top Responsáveis</div>
        <div className="card-sub" style={{marginBottom:16}}>Colaboradores com mais reservas no período</div>
        {respTop.length===0
          ? <div className="empty" style={{padding:'16px 0'}}><p>Sem dados.</p></div>
          : <div className="bar-chart">
              {respTop.map(([nm,qt])=>(
                <div key={nm} className="bar-row">
                  <div className="bar-lbl">{nm}</div>
                  <div className="bar-track">
                    <div className="bar-fill" style={{width:`${(qt/respMax)*100}%`,background:'var(--sb)',transition:'background .4s'}}/>
                  </div>
                  <div className="bar-val">{qt}</div>
                </div>
              ))}
            </div>
        }
      </div>
    </div>
  );
}

/* ─── APP ────────────────────────────────────────── */
const NAV=[
  {id:'agendar', label:'Novo Agendamento', ico:'📅'},
  {id:'grade',   label:'Grade de Horários', ico:'📊'},
  {id:'lista',   label:'Lista Completa',   ico:'📋'},
  {id:'dash',    label:'Dashboard',        ico:'📈'},
];

function App(){
  const [logado,setLogado]=useState(()=>{
    try{
      if(window.self!==window.top){
        var cs=null; try{ cs=window.parent.currentSession||null; }catch(e){}
        return {nome:(cs&&cs.name)||'Portal Redentor', admin:!!(cs&&cs.role==='admin'), username:(cs&&cs.username)||''};
      }
      return null;
    }catch(e){ return {nome:'Portal Redentor', admin:false}; }
  });
  const [agends,setAgends]=useState(()=>{try{var _s=localStorage.getItem('salas_agendamentos_v1');return _s?JSON.parse(_s):[];}catch(e){return [];}});
  const [data,setData]=useState(HOJE);
  const [aba,setAba]=useState(CAN_EDIT?'agendar':'grade');
  const [tema,setTema]=useState('default');
  const [modal,setModal]=useState(null);
  const [editItem,setEditItem]=useState(null);

  /* Tema acompanha o Hub automaticamente (claro/escuro), inclusive se trocar com o sistema aberto */
  useEffect(()=>{
    try{
      if(FORA_DO_HUB)return;
      const b=window.parent.document.body;
      const aplicar=()=>setTema(b.classList.contains('theme-dark')?'dark':'default');
      aplicar();
      const mo=new MutationObserver(aplicar);
      mo.observe(b,{attributes:true,attributeFilter:['class']});
      return()=>mo.disconnect();
    }catch(e){}
  },[]);
  useEffect(()=>{
    const el=document.documentElement;
    el.removeAttribute('data-t');
    if(tema!=='default') el.setAttribute('data-t',tema);
  },[tema]);
  useEffect(()=>{
    try{ localStorage.setItem('salas_agendamentos_v1', JSON.stringify(agends)); }catch(e){}
    try{ if(window.parent&&window.parent.syncPush) window.parent.syncPush(); }catch(e){} /* banco atualizado na hora (painel de porta) */
  },[agends]);
  useEffect(()=>{ window.__ME = logado||{}; },[logado]);

  const mergeExternos=useCallback(lista=>{
    if(!lista||!lista.length)return;
    setAgends(p=>{
      const ids=new Set(p.map(a=>String(a.id)));
      const novos=lista.filter(a=>a&&a.id&&!ids.has(String(a.id)));
      return novos.length?[...p,...novos]:p;
    });
  },[]);
  const add=useCallback(ag=>{
    setAgends(p=>[...p,ag]);
    setData(ag.data); setAba('grade');
  },[]);

  const pedirRemover=useCallback(item=>setModal(item),[]);

  const confirmarRemover=useCallback(id=>{
    setAgends(p=>{
      const item=p.find(a=>a.id===id);
      try{
        if(item && item.criadoPorUser && window.parent && typeof window.parent.agendaRemove==='function'){
          window.parent.agendaRemove(item.criadoPorUser, id);
        }
      }catch(e){}
      return p.filter(a=>a.id!==id);
    });
    try{ cancelarConvitesReserva(id); }catch(e){}
    setModal(null);
  },[]);

  const salvarEdicao=useCallback((id,novos)=>{
    setAgends(p=>{
      const item=p.find(a=>a.id===id);
      try{
        if(item && item.criadoPorUser && window.parent && typeof window.parent.agendaUpdate==='function'){
          const sl=SALAS.find(x=>x.id===novos.salaId);
          window.parent.agendaUpdate(item.criadoPorUser, id, {
            titulo:novos.evento, data:novos.data, inicio:novos.inicio, fim:novos.fim,
            local:(sl?sl.nome:''), obs:novos.obs||''
          });
        }
      }catch(e){}
      return p.map(a=>a.id===id?{...a,...novos}:a);
    });
    try{ const sl2=SALAS.find(x=>x.id===novos.salaId); atualizarConvitesReserva(id,novos,sl2?sl2.nome:''); }catch(e){}
    setEditItem(null);
  },[]);

  const navData=dir=>{
    const d=new Date(data+'T12:00');
    d.setDate(d.getDate()+dir);
    setData(d.toISOString().slice(0,10));
  };

  if(!logado) return <LoginScreen onLogin={setLogado}/>;

  return(
    <>
      {/* Header — só fora do Hub; dentro dele o topo do portal já identifica o sistema */}
      {FORA_DO_HUB&&<header className="hdr">
        <div className="hdr-in">
          <div className="logo">
            <div className="logo-m">G</div>
            <div>
              <div className="logo-n">Agendamento de Salas de Treinamento</div>
              <div className="logo-s">Setor de Treinamento</div>
            </div>
          </div>
          <div className="hdr-right">
            {SALAS.map(s=>(
              <div key={s.id} className="hdr-sala">
                <div style={{width:7,height:7,borderRadius:'50%',background:s.hex}}/>
                <span style={{fontSize:'.66rem',opacity:.8}}>{s.nome.replace('Sala ','')}</span>
                <StatusBadge salaId={s.id} data={hoje()} agends={agends}/>
              </div>
            ))}
          </div>
        </div>
      </header>}

      {/* Nav */}
      {!CAN_EDIT&&<div style={{background:'linear-gradient(90deg,rgba(180,83,9,.14),transparent)',borderBottom:'1px solid rgba(180,83,9,.35)',padding:'8px 22px',fontSize:'.74rem',fontWeight:600,color:'var(--t2)'}}>
        🔒 Somente consulta — a criação e edição de agendamentos é feita pelo setor de Treinamento.
      </div>}
      <div className="nav-wrap">
        <div className="nav-in">
          {(CAN_EDIT?NAV:NAV.filter(n=>n.id!=='agendar')).map(n=>(
            <button key={n.id} className={`nav-btn${aba===n.id?' on':''}`} onClick={()=>setAba(n.id)}>
              <span className="nav-ico"><NavIco id={n.id}/></span>{n.label}
            </button>
          ))}
          <div className="nav-right">
            {SALAS.map(s=>(
              <div key={s.id} className="nav-sala" title={s.nome}>
                <span className="ns-dot" style={{background:s.hex}}/>
                {s.nome.replace('Sala ','')}
                <StatusBadge salaId={s.id} data={hoje()} agends={agends}/>
              </div>
            ))}
          </div>
        </div>
      </div>

      {/* Content */}
      <main className="page">
        {aba==='agendar'&&CAN_EDIT&&(
          <div className="two-col">
            <Formulario agends={agends} onAdd={add} onMerge={mergeExternos}/>
            <div style={{display:'flex',flexDirection:'column',gap:14}}>
              {/* mini grade hoje */}
              <div className="card card-p">
                <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:14}}>
                  <div>
                    <div className="card-title">Disponibilidade — Hoje</div>
                    <div className="card-sub">{diaSem(HOJE)}, {fmtD(HOJE)}</div>
                  </div>
                  <span style={{background:'var(--a)',color:'#fff',borderRadius:'99px',
                    padding:'3px 12px',fontSize:'.65rem',fontWeight:800,transition:'background .4s'}}>
                    {agends.filter(a=>a.data===HOJE).length} reservas
                  </span>
                </div>
                <div className="grade-ov">
                  {SALAS.map(sl=>{
                    const slots=agends.filter(a=>a.salaId===sl.id&&a.data===HOJE);
                    const np=nowPct();
                    return(
                      <div key={sl.id} className="grade-row">
                        <div className="grade-hd">
                          <div style={{width:8,height:8,borderRadius:'50%',background:sl.hex}}/>
                          {sl.nome}
                          <StatusBadge salaId={sl.id} data={HOJE} agends={agends}/>
                        </div>
                        <div className="track">
                          {HORAS.map(h=>(
                            <div key={h} className="htick" style={{left:`${((h-HI)/(HF-HI))*100}%`}}>
                              <span className="hlbl">{p2(h)}h</span>
                            </div>
                          ))}
                          {slots.map(a=>(
                            <div key={a.id} className="sblk"
                              style={{left:`${pctLeft(a.inicio)}%`,width:`calc(${pctW(a.inicio,a.fim)}% - 2px)`,background:sl.hex}}
                              onClick={()=>pedirRemover(a)}>
                              <div className="sblk-ev">{a.evento}</div>
                              <div className="sblk-nm">👤 {a.responsavel}</div>
                            </div>
                          ))}
                          {np!==null&&<div className="nowline" style={{left:`${np}%`}}><div className="nowdot"/></div>}
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
              {/* stats rápidos */}
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
                {SALAS.map(s=>(
                  <div key={s.id} className="card" style={{padding:'14px 16px'}}>
                    <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:10}}>
                      <div style={{width:28,height:28,borderRadius:8,background:s.hex,display:'flex',
                        alignItems:'center',justifyContent:'center',color:'#fff',fontWeight:900,fontSize:'.78rem'}}>
                        {s.nome[0]}
                      </div>
                      <div style={{fontSize:'.7rem',fontWeight:700,color:'var(--t1)'}}>{s.nome}</div>
                    </div>
                    <div style={{display:'flex',gap:14}}>
                      <div>
                        <div style={{fontSize:'1.4rem',fontWeight:900,color:'var(--t1)',lineHeight:1}}>
                          {agends.filter(a=>a.salaId===s.id&&a.data===HOJE).length}
                        </div>
                        <div style={{fontSize:'.6rem',color:'var(--t4)',marginTop:2}}>hoje</div>
                      </div>
                      <div>
                        <div style={{fontSize:'1.4rem',fontWeight:900,color:s.hex,lineHeight:1}}>
                          {agends.filter(a=>a.salaId===s.id).length}
                        </div>
                        <div style={{fontSize:'.6rem',color:'var(--t4)',marginTop:2}}>total</div>
                      </div>
                    </div>
                    <StatusBadge salaId={s.id} data={HOJE} agends={agends}/>
                  </div>
                ))}
              </div>
            </div>
          </div>
        )}

        {aba==='grade'&&(
          <div style={{display:'flex',flexDirection:'column',gap:14}}>
            <div className="card" style={{padding:'12px 16px',display:'flex',alignItems:'center',justifyContent:'space-between',gap:10,flexWrap:'wrap'}}>
              <div className="date-nav">
                <button className="btn-ghost" onClick={()=>navData(-1)}>‹ Anterior</button>
                <input type="date" value={data} onChange={e=>setData(e.target.value)}
                  className="finp" style={{maxWidth:160,padding:'7px 12px'}}/>
                <button className="btn-ghost" onClick={()=>navData(1)}>Próximo ›</button>
                <button className="btn-ghost" onClick={()=>setData(HOJE)}
                  style={data===HOJE?{borderColor:'var(--a)',color:'var(--a)',background:'var(--ahl)'}:{}}>
                  Hoje
                </button>
              </div>
            </div>
            <Grade agends={agends} data={data} onRemover={pedirRemover} onEditar={setEditItem}/>
          </div>
        )}

        {aba==='lista'&&<Lista agends={agends} onRemover={pedirRemover} onEditar={setEditItem}/>}
        {aba==='dash' &&<Dashboard agends={agends}/>}
      </main>

      {/* Modal */}
      <Modal item={modal} onConfirm={confirmarRemover} onCancel={()=>setModal(null)}/>
      {editItem&&<EditModal key={editItem.id} item={editItem} agends={agends} onSave={salvarEdicao} onCancel={()=>setEditItem(null)} onMerge={mergeExternos}/>}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
<script>
/* ☁ Receptor do painel Drive do Redentor Hub */
window.addEventListener("message",function(ev){
  try{
    var d=ev.data;
    if(!(d&&d.hubDrive==="import"&&d.buf))return;
    var f=new File([d.buf],d.nome||"planilha.xlsx",{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
    var inp=document.querySelector("input[type=file][accept*=xls i]")||document.querySelector("input[type=file][accept*=sheet i]")||document.querySelector("input[type=file]");
    if(inp){
      try{
        var dt=new DataTransfer(); dt.items.add(f); inp.files=dt.files;
        try{ev.source.postMessage({hubDrive:"ok"},"*");}catch(e){}
        inp.dispatchEvent(new Event("change",{bubbles:true}));
        return;
      }catch(e){}
    }
    /* sem importador nativo: o Hub mostra o aviso adequado */
  }catch(e){}
});
</script>
</body>
</html>
