; Limites do Redentor Hub.
;
; O TV Indoor sobe vídeo para a parede e o painel sobe .apk do app —
; o limite padrão do PHP (2 MB) derruba os dois. O subir_app.php já
; manda em pedaços, mas widget/mídia vão inteiros.
upload_max_filesize = 512M
post_max_size       = 512M
memory_limit        = 512M
max_execution_time  = 300
max_input_time      = 300
max_file_uploads    = 40

date.timezone = America/Sao_Paulo

; Em produção o erro vai para o log, nunca para a tela: mensagem de
; erro do PHP entrega caminho de arquivo e credencial para quem olha.
display_errors        = Off
display_startup_errors = Off
log_errors            = On
error_log             = /dev/stderr

; Sessão. O Hub autentica por sessão em tudo que não é TV.
session.cookie_httponly = 1
session.cookie_samesite = Lax
session.use_strict_mode = 1
session.gc_maxlifetime  = 28800

expose_php = Off

opcache.enable                  = 1
opcache.memory_consumption      = 192
opcache.max_accelerated_files   = 20000
opcache.validate_timestamps     = 1
opcache.revalidate_freq         = 2
