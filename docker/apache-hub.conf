# Faz os .htaccess do projeto valerem. Sem AllowOverride, o Apache
# lê e ignora — e as pastas protegidas viram pasta pública.
<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

# O Hub abre pelo index.html; o index.php não existe na raiz.
DirectoryIndex index.html index.php

# Nome do servidor, só para o Apache parar de reclamar no log.
ServerName localhost

# Não anunciar versão do Apache/PHP para quem faz varredura.
ServerTokens Prod
ServerSignature Off

# Cabeçalhos básicos. O código já manda os dele em cada resposta PHP;
# estes cobrem os arquivos estáticos, que passam direto pelo Apache.
<IfModule mod_headers.c>
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "no-referrer"
</IfModule>

# Nunca servir os arquivos de segredo, mesmo que alguém acerte o nome.
<FilesMatch "(^\.|_secrets\.php$|^db_config\.php$|\.(sql|log|md)$)">
    Require all denied
</FilesMatch>

# ------------------------------------------------------------
#  Compressão
#
#  O painel do TV Indoor é um arquivo só, de 331 KB — 235 KB deles
#  são JavaScript. Comprimido sai com 96 KB. O player, que cada TV
#  busca de novo a cada atualização, cai de 42 KB para 15 KB.
#
#  Não comprime imagem, vídeo nem fonte: já são formatos comprimidos,
#  e passá-los pelo gzip gasta CPU para economizar quase nada — às
#  vezes até cresce.
# ------------------------------------------------------------
<IfModule mod_deflate.c>
    AddOutputFilterByType DEFLATE text/html text/plain text/css text/xml
    AddOutputFilterByType DEFLATE application/javascript application/x-javascript
    AddOutputFilterByType DEFLATE application/json application/xml
    AddOutputFilterByType DEFLATE image/svg+xml

    # Proxy que não entende Vary pode entregar conteúdo comprimido a
    # quem não pediu. A rede das TVs passa por equipamento antigo.
    <IfModule mod_headers.c>
        Header append Vary Accept-Encoding
    </IfModule>
</IfModule>
