# Faz os .htaccess do projeto valerem. Sem AllowOverride, o Apache
# lê e ignora — e as pastas protegidas viram pasta pública.
<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

# O Hub abre pelo index.html; o index.php não existe na raiz.
DirectoryIndex index.html index.php

# Nome do servidor, só para o Apache parar de reclamar no log.
ServerName localhost

# Não anunciar versão do Apache/PHP para quem faz varredura.
ServerTokens Prod
ServerSignature Off

# Cabeçalhos básicos. O código já manda os dele em cada resposta PHP;
# estes cobrem os arquivos estáticos, que passam direto pelo Apache.
<IfModule mod_headers.c>
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "no-referrer"
</IfModule>

# Nunca servir os arquivos de segredo, mesmo que alguém acerte o nome.
<FilesMatch "(^\.|_secrets\.php$|^db_config\.php$|\.(sql|log|md)$)">
    Require all denied
</FilesMatch>
