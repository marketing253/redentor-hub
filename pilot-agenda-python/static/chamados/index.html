<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chamados — Redentor (piloto Python)</title>
<link rel="stylesheet" href="/style.css">
<style>
  .abas{display:flex;gap:6px;margin-bottom:18px}
  .aba{background:var(--sup);border:1px solid var(--sup2);color:var(--txt2);border-radius:8px;
    padding:8px 16px;font-size:13px;cursor:pointer;font-family:inherit}
  .aba.ativa{background:var(--azul);color:#fff;border-color:var(--azul)}
  .item{border-bottom:1px solid var(--sup2);padding:12px 0}
  .item:last-child{border:0}
  .item-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
  .item-tit{font-weight:600;font-size:14px}
  .item-meta{font-size:12px;color:var(--txt2);margin-top:3px}
  .item-desc{font-size:13px;color:var(--txt2);margin-top:6px;white-space:pre-wrap}
  .acoes{display:flex;gap:8px;margin-top:8px}
  .acoes button{background:transparent;border:1px solid #2c3260;color:var(--txt2);
    border-radius:6px;padding:4px 10px;font-size:12px;cursor:pointer;font-family:inherit}
  .nv-item{border-bottom:1px solid var(--sup2);padding:10px 0}
  .nv-data{font-size:11px;color:var(--ouro-cl);font-weight:700}
  .nv-sis{font-size:12px;color:var(--txt2);margin-left:6px}
  .nv-txt{font-size:13px;margin-top:4px}
</style>
</head>
<body>
<div class="marca"><b>🛠 Chamados</b><a class="btn-voltar" href="/">← Voltar</a></div>
<div class="wrap">
  <div class="abas">
    <button class="aba ativa" id="tChamados" onclick="mostrarAba('chamados')">Chamados</button>
    <button class="aba" id="tNovidades" onclick="mostrarAba('novidades')">🔔 Novidades</button>
  </div>

  <div id="painelChamados">
    <div class="card">
      <h2>Abrir chamado</h2>
      <label>Título</label>
      <input id="fTitulo" placeholder="Resumo do problema/pedido">
      <div class="linha">
        <div><label>Sistema</label><input id="fSistema" placeholder="Ex.: Abastecimento"></div>
        <div><label>Tipo</label>
          <select id="fTipo"><option>Melhoria</option><option>Bug</option><option>Dúvida</option><option>Outro</option></select>
        </div>
      </div>
      <label>Descrição</label>
      <textarea id="fDesc" placeholder="Detalhe o que precisa"></textarea>
      <div class="linha">
        <div><label>Aberto por</label><input id="fAbertoPor" placeholder="Seu nome"></div>
        <div><label>Envolvidos (opcional)</label><input id="fEnvolvidos"></div>
        <div><label>Prazo (opcional)</label><input id="fPrazo" type="date"></div>
      </div>
      <button class="btn ouro" onclick="salvar()">Abrir chamado</button>
    </div>
    <div class="card">
      <h2>Todos os chamados</h2>
      <div id="lista"></div>
    </div>
  </div>

  <div id="painelNovidades" style="display:none" class="card">
    <h2>Histórico de novidades</h2>
    <div id="listaNv"></div>
  </div>
</div>

<script>
const API = '';

function mostrarAba(aba){
  document.getElementById('painelChamados').style.display = aba === 'chamados' ? '' : 'none';
  document.getElementById('painelNovidades').style.display = aba === 'novidades' ? '' : 'none';
  document.getElementById('tChamados').classList.toggle('ativa', aba === 'chamados');
  document.getElementById('tNovidades').classList.toggle('ativa', aba === 'novidades');
  if(aba === 'novidades') carregarNovidades();
}

async function carregar(){
  const r = await fetch(`${API}/api/chamados`);
  const itens = await r.json();
  const lista = document.getElementById('lista');
  if(!itens.length){ lista.innerHTML = '<div class="vazio">Nenhum chamado ainda.</div>'; return; }
  lista.innerHTML = itens.map(c => `
    <div class="item">
      <div class="item-top">
        <div>
          <div class="item-tit">#${c.id} — ${escapeHtml(c.titulo)}</div>
          <div class="item-meta">${escapeHtml(c.sistema||'—')} · ${escapeHtml(c.tipo||'—')} · aberto por ${escapeHtml(c.aberto_por)}${c.prazo ? ' · prazo '+c.prazo.slice(8,10)+'/'+c.prazo.slice(5,7) : ''}</div>
        </div>
        <span class="status ${c.status}">${c.status}</span>
      </div>
      <div class="item-desc">${escapeHtml(c.descricao)}</div>
      <div class="acoes">
        ${c.status !== 'Concluído' ? `<button onclick="concluir(${c.id})">✔ Concluir</button>` : ''}
        <button onclick="excluir(${c.id})">🗑 Excluir</button>
      </div>
    </div>
  `).join('');
}

async function salvar(){
  const titulo = document.getElementById('fTitulo').value.trim();
  const descricao = document.getElementById('fDesc').value.trim();
  const aberto_por = document.getElementById('fAbertoPor').value.trim();
  if(!titulo || !descricao || !aberto_por){ alert('Preencha ao menos título, descrição e quem abriu.'); return; }
  await fetch(`${API}/api/chamados`, {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({
      titulo, descricao, aberto_por,
      sistema: document.getElementById('fSistema').value.trim() || null,
      tipo: document.getElementById('fTipo').value,
      envolvidos: document.getElementById('fEnvolvidos').value.trim() || null,
      prazo: document.getElementById('fPrazo').value || null,
      status: 'Aberto'
    })
  });
  ['fTitulo','fSistema','fDesc','fAbertoPor','fEnvolvidos','fPrazo'].forEach(id => document.getElementById(id).value = '');
  carregar();
}

async function concluir(id){
  await fetch(`${API}/api/chamados/${id}`, {
    method: 'PUT', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({status: 'Concluído'})
  });
  carregar();
}

async function excluir(id){
  if(!confirm('Excluir este chamado?')) return;
  await fetch(`${API}/api/chamados/${id}`, {method: 'DELETE'});
  carregar();
}

async function carregarNovidades(){
  const r = await fetch(`${API}/api/novidades`);
  const itens = await r.json();
  const lista = document.getElementById('listaNv');
  if(!itens.length){ lista.innerHTML = '<div class="vazio">Nenhuma novidade publicada ainda.</div>'; return; }
  lista.innerHTML = itens.map(n => `
    <div class="nv-item">
      <span class="nv-data">${n.data.slice(8,10)}/${n.data.slice(5,7)}</span>
      <span class="nv-sis">${escapeHtml(n.sistema||'')}</span>
      <div class="nv-txt">${escapeHtml(n.texto)}</div>
    </div>
  `).join('');
}

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s == null ? '' : s;
  return d.innerHTML;
}

carregar();
</script>
</body>
</html>
