<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agenda — Redentor (piloto Python)</title>
<link rel="stylesheet" href="/style.css">
<style>
  .ev{display:flex;gap:12px;align-items:flex-start;padding:12px 0;
    border-bottom:1px solid var(--sup2)}
  .ev:last-child{border:0}
  .ev-data{min-width:52px;text-align:center;background:var(--sup2);
    border-radius:8px;padding:6px 4px;font-size:11px;color:var(--ouro-cl);
    font-weight:700}
  .ev-data b{display:block;font-size:18px;color:var(--txt)}
  .ev-corpo{flex:1}
  .ev-tit{font-weight:600;font-size:14px}
  .ev-hora{color:var(--txt2);font-size:12px;margin-top:2px}
  .ev-desc{color:var(--txt2);font-size:13px;margin-top:4px;white-space:pre-wrap}
  .ev-del{background:transparent;border:1px solid #3a3f60;color:var(--neg);
    border-radius:8px;padding:5px 10px;font-size:12px;cursor:pointer}
  #loginBox{max-width:340px;margin:60px auto;text-align:center}
  #loginBox p{color:var(--txt2);font-size:13px}
  .marca-acoes{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .link-trocar{color:#c7cbee;font-size:12px;text-decoration:none}
</style>
</head>
<body>

<div id="loginBox" class="card" style="display:none">
  <h2>Quem é você?</h2>
  <p>Digite seu usuário do Hub pra ver sua agenda. (Piloto — sem senha ainda.)</p>
  <input id="loginUser" placeholder="seu.usuario">
  <button class="btn ouro" onclick="entrar()" style="width:100%">Entrar</button>
</div>

<div id="app" style="display:none">
  <div class="marca">
    <div><b>Agenda — Redentor</b><span class="marca-sub">Piloto em Python · logado como <b id="quemSou"></b></span></div>
    <div class="marca-acoes">
      <a class="link-trocar" href="#" onclick="sair();return false">trocar usuário</a>
      <a class="btn-voltar" href="/">← Voltar</a>
    </div>
  </div>
  <div class="wrap">
    <div class="card">
      <h2>Novo compromisso</h2>
      <label>Título</label>
      <input id="fTitulo" placeholder="Ex.: Reunião com a contabilidade">
      <div class="linha">
        <div><label>Data</label><input id="fData" type="date"></div>
        <div><label>Hora (opcional)</label><input id="fHora" type="time"></div>
      </div>
      <label>Descrição (opcional)</label>
      <textarea id="fDesc" placeholder="Detalhes, local, quem participa..."></textarea>
      <button class="btn" onclick="salvar()">Adicionar</button>
    </div>
    <div class="card">
      <h2>Seus compromissos</h2>
      <div id="lista"></div>
    </div>
  </div>
</div>

<script>
const API = ''; // mesmo domínio do front — em produção, aponta pra própria URL do serviço.
let USUARIO = localStorage.getItem('agenda_usuario') || '';

function entrar(){
  const u = document.getElementById('loginUser').value.trim();
  if(!u) return;
  USUARIO = u;
  localStorage.setItem('agenda_usuario', u);
  iniciar();
}
function sair(){
  localStorage.removeItem('agenda_usuario');
  location.reload();
}

async function carregar(){
  const r = await fetch(`${API}/api/eventos?usuario=${encodeURIComponent(USUARIO)}`);
  const eventos = await r.json();
  const lista = document.getElementById('lista');
  if(!eventos.length){
    lista.innerHTML = '<div class="vazio">Nenhum compromisso ainda.</div>';
    return;
  }
  lista.innerHTML = eventos.map(ev => {
    const [ano, mes, dia] = ev.data.split('-');
    return `<div class="ev">
      <div class="ev-data">${dia}<b>${mesAbrev(mes)}</b></div>
      <div class="ev-corpo">
        <div class="ev-tit">${escapeHtml(ev.titulo)}</div>
        ${ev.hora ? `<div class="ev-hora">${ev.hora.slice(0,5)}</div>` : ''}
        ${ev.descricao ? `<div class="ev-desc">${escapeHtml(ev.descricao)}</div>` : ''}
      </div>
      <button class="ev-del" onclick="excluir(${ev.id})">Excluir</button>
    </div>`;
  }).join('');
}

async function salvar(){
  const titulo = document.getElementById('fTitulo').value.trim();
  const data = document.getElementById('fData').value;
  const hora = document.getElementById('fHora').value;
  const descricao = document.getElementById('fDesc').value.trim();
  if(!titulo || !data){ alert('Preencha ao menos título e data.'); return; }
  await fetch(`${API}/api/eventos`, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({usuario: USUARIO, titulo, data, hora: hora || null, descricao: descricao || null})
  });
  document.getElementById('fTitulo').value = '';
  document.getElementById('fHora').value = '';
  document.getElementById('fDesc').value = '';
  carregar();
}

async function excluir(id){
  if(!confirm('Excluir esse compromisso?')) return;
  await fetch(`${API}/api/eventos/${id}`, {method: 'DELETE'});
  carregar();
}

function mesAbrev(m){
  return ['JAN','FEV','MAR','ABR','MAI','JUN','JUL','AGO','SET','OUT','NOV','DEZ'][parseInt(m,10)-1];
}
function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function iniciar(){
  document.getElementById('loginBox').style.display = 'none';
  document.getElementById('app').style.display = '';
  document.getElementById('quemSou').textContent = USUARIO;
  carregar();
}

if(USUARIO){ iniciar(); } else { document.getElementById('loginBox').style.display = ''; }
</script>
</body>
</html>
