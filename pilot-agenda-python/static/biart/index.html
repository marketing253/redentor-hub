<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Biarticulado — Redentor (piloto Python)</title>
<link rel="stylesheet" href="/style.css">
<style>
  #busca{margin-bottom:14px}
</style>
</head>
<body>
<div class="marca"><b>🚌 Treinamento Biarticulado</b><a class="btn-voltar" href="/">← Voltar</a></div>
<div class="wrap">
  <div class="stats" id="stats"></div>
  <input id="busca" placeholder="Buscar por nome ou CPD..." oninput="render()">
  <table>
    <thead><tr><th>CPD</th><th>Nome</th><th>Sexo</th><th>Data</th><th>Autorização</th><th>Situação</th></tr></thead>
    <tbody id="corpo"></tbody>
  </table>
</div>

<script>
const API = '';
let REGISTROS = [];

async function carregar(){
  const r = await fetch(`${API}/api/biart`);
  REGISTROS = await r.json();
  render();
}

function situacao(r){
  if(r.processo === 'Processo Concluído') return {texto: 'Concluído', classe: 'concl'};
  if(!r.data) return {texto: 'Dentro do prazo', classe: 'ok'};
  const hoje = new Date(); hoje.setHours(0,0,0,0);
  const d = new Date(r.data+'T00:00:00');
  const dias = Math.floor((hoje - d) / 86400000);
  return dias >= 31 ? {texto:'Prazo vencido', classe:'venc'} : {texto:'Dentro do prazo', classe:'ok'};
}

function render(){
  const busca = document.getElementById('busca').value.trim().toLowerCase();
  const filtrados = REGISTROS.filter(r =>
    !busca || (r.nome||'').toLowerCase().includes(busca) || (r.cpd||'').includes(busca)
  );
  const vencidos = REGISTROS.filter(r => situacao(r).classe === 'venc').length;
  const concluidos = REGISTROS.filter(r => situacao(r).classe === 'concl').length;
  document.getElementById('stats').innerHTML = `
    <div class="stat"><b>${REGISTROS.length}</b><span>Total</span></div>
    <div class="stat"><b>${concluidos}</b><span>Concluídos</span></div>
    <div class="stat"><b style="color:var(--neg)">${vencidos}</b><span>Prazo vencido</span></div>
  `;
  document.getElementById('corpo').innerHTML = filtrados.map(r => {
    const s = situacao(r);
    return `<tr>
      <td>${escapeHtml(r.cpd||'—')}</td>
      <td>${escapeHtml(r.nome)}</td>
      <td>${escapeHtml(r.sexo||'—')}</td>
      <td>${r.data ? r.data.slice(8,10)+'/'+r.data.slice(5,7)+'/'+r.data.slice(0,4) : '—'}</td>
      <td>${escapeHtml(r.autorizacao||'—')}</td>
      <td><span class="status ${s.classe}">${s.texto}</span></td>
    </tr>`;
  }).join('');
}

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s == null ? '' : s;
  return d.innerHTML;
}

carregar();
</script>
</body>
</html>
